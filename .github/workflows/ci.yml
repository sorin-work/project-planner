name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      # The restore check below removes a database volume. This makes sure
      # that it refuses wherever that volume could be somebody's data. A
      # stand-in plays docker, so nothing is started.
      - name: Check the guards of the restore check
        run: sh scripts/check-restore-guards.sh

      - run: docker compose build

      # The only place where the stack is started. Brings up db and api with
      # the demo data, runs the backup loop against made-up clocks, dumps the
      # database, restores the dump and compares the row counts. Then it
      # restores an older dump onto a new volume and lets the api migrate it,
      # and checks that the api refuses a database from a newer version. The
      # project name is the default one, so that the images built above are
      # used. The script accepts that name in CI only.
      - name: Check that the stack starts and a backup restores
        run: sh scripts/check-restore.sh
        env:
          CHECK_PROJECT: project-planner
        timeout-minutes: 10
