# HTTP
quarkus.http.port=${PORT:8080}

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5451/planner}
quarkus.datasource.username=${DATABASE_USER:planner}
quarkus.datasource.password=${DATABASE_PASSWORD:planner}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.log.sql=false

# Migrations run on every start; the schema is owned by Flyway, not Hibernate.
quarkus.flyway.migrate-at-start=true

# Auth: HS256 tokens signed with JWT_SECRET (at least 32 bytes).
mp.jwt.verify.issuer=project-planner
mp.jwt.verify.publickey.algorithm=HS256
smallrye.jwt.verify.secretkey=${JWT_SECRET:local-development-secret-change-me-0123456789}
planner.jwt.secret=${JWT_SECRET:local-development-secret-change-me-0123456789}
planner.jwt.ttl=${JWT_TTL:P7D}

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Tests run against an in-memory H2 database in PostgreSQL mode.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:planner;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
