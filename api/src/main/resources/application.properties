# HTTP
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5191}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Content-Disposition

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5451/planner}
quarkus.datasource.username=${DATABASE_USER:planner}
quarkus.datasource.password=${DATABASE_PASSWORD:planner}
# No dev services: the database comes from compose and tokens use JWT_SECRET.
quarkus.devservices.enabled=false
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.log.sql=false

# Migrations run on every start; the schema is owned by Flyway, not Hibernate.
quarkus.flyway.migrate-at-start=true
# Branches merge in any order, so a lower version can arrive after a higher one has already run.
quarkus.flyway.out-of-order=true

# Auth: HS256 tokens signed with JWT_SECRET (at least 32 bytes), see JwtKeys.
# No public key: otherwise dev and test mode generate an RSA key pair for smallrye-jwt.
mp.jwt.verify.publickey=NONE
planner.jwt.secret=${JWT_SECRET:local-development-secret-change-me-0123456789}
planner.jwt.ttl=${JWT_TTL:P7D}
# Check tokens only where an endpoint needs them, so a stale token can't block sign-in.
quarkus.http.auth.proactive=false

# Mail: invitations and password reset links, sent by SMTP. Off unless MAIL_HOST is set;
# then MAIL_FROM and APP_URL are required too, see MailSettings. Links are built from
# APP_URL, never from the Host header of a request.
planner.mail.host=${MAIL_HOST:}
planner.mail.from=${MAIL_FROM:}
planner.app-url=${APP_URL:}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
# The connection to the mail server has to be encrypted: STARTTLS, or TLS from the start
# with MAIL_TLS=true (port 465). MAIL_STARTTLS=DISABLED lifts it, for a mail catcher.
quarkus.mailer.start-tls=${MAIL_STARTTLS:REQUIRED}
quarkus.mailer.tls=${MAIL_TLS:false}
# With mail on, an address with a mailed invitation always needs its link to sign up.
# This makes every sign-up need one, which closes the app to people nobody invited. Off
# by default.
planner.signup.invite-link-required=${INVITE_LINK_REQUIRED:false}
# The limit on reset requests per client goes by the address nginx saw. Only for an API
# that is reached through the web container, which overwrites X-Forwarded-For. A request
# from anywhere else keeps its own address, whatever header it sends.
quarkus.http.proxy.proxy-address-forwarding=${BEHIND_PROXY:false}
quarkus.http.proxy.allow-x-forwarded=${BEHIND_PROXY:false}
# Only from these addresses is the header believed. Compose sets the web container.
quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1}

# Demo data
planner.seed-demo=${SEED_DEMO:false}

# Health checks live under /q/health; keep them reachable without a token.
quarkus.smallrye-health.ui.enabled=false

# API reference: the OpenAPI document is built from the resources at build time and
# served under /api so that it is reachable through the web container, without a token.
quarkus.smallrye-openapi.path=/api/openapi
quarkus.smallrye-openapi.info-title=project-planner API
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearer
quarkus.smallrye-openapi.security-scheme-description=The token from POST /api/auth/login or /api/auth/signup, sent as "Authorization: Bearer <token>".
quarkus.smallrye-openapi.operation-id-strategy=class-method
# Tags and summaries are written by hand, so that a missing one fails ApiReferenceTest.
quarkus.smallrye-openapi.auto-add-tags=false
quarkus.smallrye-openapi.auto-add-operation-summary=false
# The interactive page (Swagger UI) is in the build but only served when asked for:
# it is third-party script on the origin where the web app keeps the login token.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.enabled=${API_DOCS:false}
quarkus.swagger-ui.title=project-planner API
# Without this the page asks validator.swagger.io to check the document, which tells that
# site where this API is and has it fetch the document from there.
quarkus.swagger-ui.validator-url=none

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Tests run against an in-memory H2 database in PostgreSQL mode.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:planner;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.planner.seed-demo=false
# Mail is on in the tests and goes to the mock mailbox; nothing talks to a mail server.
%test.planner.mail.host=localhost
%test.planner.mail.from=planner@example.com
%test.planner.app-url=http://planner.test
%test.quarkus.mailer.mock=true
# The tests see which rows are locked and written, in order, to check the lock order.
%test.quarkus.hibernate-orm.unsupported-properties."hibernate.session_factory.statement_inspector"=com.projectplanner.support.LockLog
