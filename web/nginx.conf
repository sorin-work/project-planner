server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The policy for the app. The login token sits in localStorage, so this is what stands
  # between a script slipped into a page and every session: scripts only from this server,
  # no inline ones, and no framing. Styles too only come from files: the components have no
  # styles of their own (the lint refuses them), [style.width.%] bindings go through the DOM,
  # which the policy allows, and the build does not inline critical CSS, since it would load
  # the rest with an inline script (inlineCritical in angular.json). Not sent on /api/: the
  # answers there set their own (attachments have a stricter one, and the API reference at
  # /api/docs runs a script of its own).
  set $app_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  # The browser only talks to this container; /api is forwarded to the Quarkus service.
  # All of it, hence ^~: without it the rule for .js and .css files below would answer for
  # the scripts and styles of the API reference at /api/docs.
  location ^~ /api/ {
    # An attachment can have 20 MB. Up to 25 MB the API answers with its own message,
    # above that nginx refuses the request.
    client_max_body_size 25m;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replaced, not added to: the api limits reset requests per client by this address,
    # so a value the browser sent must not get through.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # The Angular build fingerprints its bundles, so they can be cached forever.
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # A location with an add_header of its own does not inherit the ones of the server,
    # so the security headers are repeated in each location that serves the app.
    add_header Content-Security-Policy $app_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths get the app shell.
  location / {
    add_header Content-Security-Policy $app_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    try_files $uri /index.html;
  }
}
