server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  # The browser only talks to this container; /api is forwarded to the Quarkus service.
  # All of it, hence ^~: without it the rule for .js and .css files below would answer for
  # the scripts and styles of the API reference at /api/docs.
  location ^~ /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # The Angular build fingerprints its bundles, so they can be cached forever.
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths get the app shell.
  location / {
    try_files $uri /index.html;
  }
}
